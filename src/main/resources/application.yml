server:
  port: ${SERVER_PORT:8082}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  application:
    name: ms-pedidos360-ordenes
  # Base de datos (por defecto H2 en memoria si no se especifica DB_URL de Oracle)
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;MODE=Oracle}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

# Propiedad usada por CatalogClient.java (acepta CATALOG_SERVICE_URL o la antigua CATALOG_URL)
catalog:
  service:
    url: ${CATALOG_SERVICE_URL:${CATALOG_URL:http://localhost:8081}}
clients:
  catalog-url: ${CATALOG_SERVICE_URL:${CATALOG_URL:http://localhost:8081}}

# Nombres centralizados de RabbitMQ por caso de uso (sin strings acoplados en código)
app:
  rabbitmq:
    notificaciones:
      exchange: pedidos360.ordenes.exchange
      queue: pedidos360.ordenes.notificaciones.queue
      routing-key: pedidos360.ordenes.notificacion
      dlx: pedidos360.ordenes.dlx
      dlq: pedidos360.ordenes.notificaciones.dlq
      dlq-routing-key: pedidos360.ordenes.dlq.key
    tickets:
      exchange: pedidos360.ordenes.tickets.exchange
      queue: pedidos360.ordenes.tickets.queue
      routing-key: pedidos360.ordenes.ticket
      dlx: pedidos360.ordenes.tickets.dlx
      dlq: pedidos360.ordenes.tickets.dlq
      dlq-routing-key: pedidos360.ordenes.tickets.dlq.key
