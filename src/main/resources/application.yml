server:
  port: ${SERVER_PORT:8082}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  application:
    name: ms-pedidos360-ordenes
  # Base de datos (por defecto H2 en memoria si no se especifica DB_URL de Oracle)
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;MODE=Oracle}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: pedidos360-ordenes-analitica-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3
      properties:
        partitioner.class: com.pedidos360.orders.kafka.OrderKafkaPartitioner
    listener:
      ack-mode: record
      missing-topics-fatal: false

# Propiedad usada por CatalogClient.java (acepta CATALOG_SERVICE_URL o la antigua CATALOG_URL)
catalog:
  service:
    url: ${CATALOG_SERVICE_URL:${CATALOG_URL:http://localhost:8081}}
clients:
  catalog-url: ${CATALOG_SERVICE_URL:${CATALOG_URL:http://localhost:8081}}

# Nombres centralizados de RabbitMQ por caso de uso (sin strings acoplados en código)
app:
  rabbitmq:
    notificaciones:
      exchange: pedidos360.ordenes.exchange
      queue: pedidos360.ordenes.notificaciones.queue
      routing-key: pedidos360.ordenes.notificacion
      dlx: pedidos360.ordenes.dlx
      dlq: pedidos360.ordenes.notificaciones.dlq
      dlq-routing-key: pedidos360.ordenes.dlq.key
    tickets:
      exchange: pedidos360.ordenes.tickets.exchange
      queue: pedidos360.ordenes.tickets.queue
      routing-key: pedidos360.ordenes.ticket
      dlx: pedidos360.ordenes.tickets.dlx
      dlq: pedidos360.ordenes.tickets.dlq
      dlq-routing-key: pedidos360.ordenes.tickets.dlq.key
  kafka:
    topics:
      ordenes-eventos:
        name: ${KAFKA_TOPIC_ORDENES:pedidos360.ordenes.eventos}
        dlt: ${KAFKA_TOPIC_ORDENES_DLT:pedidos360.ordenes.eventos.DLT}
        partitions: 3
        replicas: 1
        retention-ms: 604800000
        cleanup-policy: delete
      inventario-eventos:
        name: ${KAFKA_TOPIC_INVENTARIO:pedidos360.inventario.eventos}
        dlt: ${KAFKA_TOPIC_INVENTARIO_DLT:pedidos360.inventario.eventos.DLT}
        partitions: 3
        replicas: 1
        retention-ms: 259200000
        cleanup-policy: compact,delete
    groups:
      analitica: pedidos360-ordenes-analitica-group
      auditoria: pedidos360-ordenes-auditoria-group
      inventario-sync: pedidos360-ordenes-inventario-sync-group
      dlt: pedidos360-ordenes-dlt-group
